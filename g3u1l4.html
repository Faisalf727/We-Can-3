var AR={listen:"استمع ثم اختر الجملة أو الكلمة التي سمعتها",reply:"اختر الرد المناسب",build:"رتّب الكلمات لتكوين الجملة",line:"استمع ثم اضغط على الطالب الصحيح",match:"طابِق: اضغط العنصر في العمود الأيسر ثم ما يناسبه في العمود الأيمن",fill:"اختر الحرف أو الحروف الناقصة",pic:"استمع ثم اختر الصورة الصحيحة",sound:"استمع ثم اختر الصوت الصحيح"};

var S={step:-1,name:"",cls:"",score:0,wrong:[]};
var app=document.getElementById("app");
function el(tag,attrs,kids){var e=document.createElement(tag);for(var k in (attrs||{})){if(k==="class")e.className=attrs[k];else if(k==="text")e.textContent=attrs[k];else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}(kids||[]).forEach(function(c){if(c)e.appendChild(c)});return e}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function isPic(s){return typeof s==="string"&&s.indexOf("img:")===0}
function picEl(s){var n=s.slice(4);return el("img",{class:"pimg",src:IMG[n]||"",alt:n,draggable:"false"})}
function isEmo(s){return /^[←-⯿\u{1F000}-\u{1FFFF}️‍]+$/u.test(s)}

var VOICE=null;
function pickVoice(){
  try{
    var vs=window.speechSynthesis.getVoices()||[];if(!vs.length)return;
    var best=null;
    vs.forEach(function(v){var l=(v.lang||"").replace("_","-").toLowerCase();
      if(l==="en-us"&&!best)best=v;
    });
    if(!best)vs.forEach(function(v){if(!best&&(v.lang||"").toLowerCase().indexOf("en")===0)best=v});
    VOICE=best;
  }catch(e){}
}
try{if(window.speechSynthesis){pickVoice();window.speechSynthesis.onvoiceschanged=pickVoice}}catch(e){}
function speak(text){
  try{
    if(typeof text==="string"&&text.indexOf("aud:")===0){var k=text.slice(4);if(AUD[k]){try{if(window.speechSynthesis)window.speechSynthesis.cancel();if(CUR){CUR.pause()}CUR=new Audio(AUD[k]);CUR.play()}catch(e){}return}text=k}
    if(!window.speechSynthesis)return;
    window.speechSynthesis.cancel();
    if(!VOICE)pickVoice();
    setTimeout(function(){
      try{
        var u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.75;u.pitch=1;
        if(VOICE)u.voice=VOICE;
        window.speechSynthesis.speak(u);
      }catch(e){}
    },80);
  }catch(e){}
}
var ctx=null;
function beep(ok){
  try{
    var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    ctx=ctx||new C();var o=ctx.createOscillator(),g=ctx.createGain();
    o.type="sine";o.frequency.value=ok?740:220;g.gain.value=.08;o.connect(g);g.connect(ctx.destination);
    o.start();o.stop(ctx.currentTime+(ok?.18:.25));
  }catch(e){}
}

function topbar(){
  return el("div",{class:"bar"},[el("span",{text:HEAD}),el("b",{text:S.step>=0&&S.step<Q.length?("Score "+S.score):""})]);
}
function dots(){
  var d=el("div",{class:"dots"});
  for(var i=0;i<Q.length;i++)d.appendChild(el("i",{class:i<S.step?"done":(i===S.step?"now":"")}));
  return d;
}
function listenBtn(text){return el("button",{class:"speak",type:"button",text:"🔊 Listen",onclick:function(){speak(text)}})}

function render(){
  app.textContent="";
  if(S.step<0)return renderStart();
  if(S.step>=Q.length)return renderEnd();
  var q=Q[ORD[S.step]];
  app.appendChild(topbar());
  var card=el("div",{class:"card"});
  var fb=el("div",{class:"fb"});
  var next=el("button",{class:"main",type:"button",text:S.step===Q.length-1?"Finish":"Next",disabled:"disabled"});
  var locked=false;
  function finish(ok,detail){
    if(locked)return;locked=true;
    beep(ok);
    if(ok){S.score++;fb.className="fb ok";fb.textContent=pick(PRAISE)+" ⭐"}
    else{S.wrong.push(ORD[S.step]+1);fb.className="fb bad";fb.textContent=pick(TRY)}
    next.removeAttribute("disabled");
    if(typeof detail==="function")detail();
  }
  card.appendChild(el("p",{class:"ar",text:q.ar||AR[q.k||q.t]||""}));

  if(q.t==="mc"){
    if(q.pic)card.appendChild(isPic(q.pic)?el("div",{class:"pic"},[picEl(q.pic)]):el("div",{class:"pic",text:q.pic}));
    if(q.show)card.appendChild(el("div",{class:"bubble",text:q.show}));
    var say=q.say||(q.show&&q.show.indexOf("_")<0?q.show:null);
    if(say)card.appendChild(listenBtn(say));
    var allEmo=q.opts.every(function(o){return isEmo(o)||isPic(o)});
    var box=el("div",{class:"opts"+(allEmo?" emo":"")}),btns=[];
    shuffle(q.opts.map(function(o,i){return{o:o,i:i}})).forEach(function(x){
      var b=el("button",{class:"opt"+(allEmo?(isPic(x.o)?" p":" e"):""),type:"button",text:isPic(x.o)?"":x.o,onclick:function(){
        if(locked)return;
        var ok=x.i===q.ans;b.classList.add(ok?"ok":"bad");
        if(!ok){btns.forEach(function(bb){if(+bb.dataset.i===q.ans)bb.classList.add("ok")})}
        btns.forEach(function(bb){bb.disabled=true});
        finish(ok);
      }});if(isPic(x.o))b.appendChild(picEl(x.o));b.dataset.i=x.i;btns.push(b);box.appendChild(b);
    });
    card.appendChild(box);
  }

  if(q.t==="build"){
    var words=q.words;
    card.appendChild(listenBtn(q.say||words.join(" ")));
    if(q.pic&&isPic(q.pic))card.appendChild(picEl(q.pic));
    var slots=el("div",{class:"slots"}),tray=el("div",{class:"tray"});
    var chosen=[];
    var check=el("button",{class:"main",type:"button",text:"Check"});
    var pool=shuffle(words.map(function(w,i){return{w:w,i:i}}));
    function redraw(){
      slots.textContent="";tray.textContent="";
      chosen.forEach(function(w,idx){slots.appendChild(el("button",{class:"chip",type:"button",text:w.w,onclick:function(){if(locked)return;chosen.splice(idx,1);redraw()}}))});
      pool.forEach(function(w){if(chosen.indexOf(w)<0)tray.appendChild(el("button",{class:"chip",type:"button",text:w.w,onclick:function(){if(locked)return;chosen.push(w);redraw()}}))});
      check.disabled=chosen.length!==pool.length||locked;
    }
    check.addEventListener("click",function(){
      if(locked)return;
      var ok=chosen.every(function(w,idx){return w.w===words[idx]});
      slots.style.borderColor=ok?"var(--ok)":"var(--bad)";
      finish(ok,function(){if(!ok){chosen=pool.slice().sort(function(a,b){return a.i-b.i});redraw();check.disabled=true}});
      check.disabled=true;
    });
    card.appendChild(slots);card.appendChild(tray);card.appendChild(check);
    redraw();
  }

  if(q.t==="match"){
    var errors=0,left=null,remaining=q.pairs.length;
    var colL=el("div",{class:"col"}),colR=el("div",{class:"col"});
    var lb=[],rb=[];
    shuffle(q.pairs.map(function(p,i){return{p:p,i:i}})).forEach(function(x){
      var b=el("button",{class:"opt"+(isPic(x.p[0])?" p":(isEmo(x.p[0])?" e":"")),type:"button",text:isPic(x.p[0])?"":x.p[0]});if(isPic(x.p[0]))b.appendChild(picEl(x.p[0]));
      b.dataset.i=x.i;
      b.addEventListener("click",function(){
        if(locked||b.disabled)return;
        lb.forEach(function(o){o.classList.remove("sel")});
        left=b;b.classList.add("sel");
        if(!isEmo(x.p[0])&&!isPic(x.p[0]))speak(x.p[0]);
      });
      lb.push(b);colL.appendChild(b);
    });
    shuffle(q.pairs.map(function(p,i){return{p:p,i:i}})).forEach(function(x){
      var b=el("button",{class:"opt"+(isPic(x.p[1])?" p":(isEmo(x.p[1])?" e":"")),type:"button",text:isPic(x.p[1])?"":x.p[1]});if(isPic(x.p[1]))b.appendChild(picEl(x.p[1]));
      b.dataset.i=x.i;
      b.addEventListener("click",function(){
        if(locked||b.disabled||!left)return;
        if(left.dataset.i===b.dataset.i){
          beep(true);
          left.classList.remove("sel");left.classList.add("ok");b.classList.add("ok");
          left.disabled=true;b.disabled=true;left=null;remaining--;
          if(remaining===0)finish(errors===0);
        }else{
          beep(false);errors++;
          b.classList.add("bad");var bb=b;setTimeout(function(){bb.classList.remove("bad")},500);
          fb.className="fb bad";fb.textContent=pick(TRY);
        }
      });
      rb.push(b);colR.appendChild(b);
    });
    card.appendChild(el("div",{class:"mt"},[colL,colR]));
  }

  if(q.t==="line"){
    card.appendChild(listenBtn(q.say));
    var kids=el("div",{class:"kids"}),ks=[];
    for(var p=1;p<=5;p++)(function(p){
      var k=el("button",{class:"kid",type:"button","aria-label":"Student "+p},[el("span",{class:"face",text:"🧒"}),el("span",{class:"n",text:String(p)})]);
      k.addEventListener("click",function(){
        if(locked)return;
        var ok=p===q.pos;k.classList.add(ok?"ok":"bad");
        if(!ok)ks[q.pos-1].classList.add("ok");
        ks.forEach(function(x){x.disabled=true});
        finish(ok);
      });ks.push(k);kids.appendChild(k);
    })(p);
    card.appendChild(kids);
    card.appendChild(el("p",{class:"sub",text:"1 first · 2 second · 3 third · 4 fourth · 5 fifth"}));
  }

  card.appendChild(fb);
  app.appendChild(card);
  next.addEventListener("click",function(){S.step++;render();window.scrollTo(0,0)});
  app.appendChild(el("div",{class:"row"},[next]));
  app.appendChild(dots());
}

function renderStart(){
  var name=el("input",{type:"text",id:"nm",placeholder:"Your name",autocomplete:"off",maxlength:"40"});
  var cls=el("input",{type:"text",id:"cl",placeholder:"Class (2/A)",autocomplete:"off",maxlength:"12"});
  var go=el("button",{class:"main",type:"button",text:"Let's start!",onclick:function(){
    var n=name.value.trim();
    if(!n){name.focus();name.style.borderColor="var(--bad)";return}
    S.name=n;S.cls=cls.value.trim();ORD=shuffle(Q.map(function(_,i){return i}));S.step=0;
    speak(HELLO);render();
  }});
  app.appendChild(el("div",{class:"card"},[
    el("h1",{text:HEAD.indexOf("Lesson")>=0?SUB:SUB}),
    el("p",{class:"sub",text:HEAD}),
    el("p",{class:"ar",text:"اكتب اسمك ثم ابدأ. ستسمع الجمل بصوتٍ عالٍ، فارفع صوت الهاتف."}),
    el("div",{},[el("label",{for:"nm",text:"Name"}),name]),
    el("div",{},[el("label",{for:"cl",text:"Class"}),cls]),
    go
  ]));
  app.appendChild(el("p",{class:"sign",text:"F.F.F"}));
}

function renderEnd(){
  var total=Q.length,pct=S.score/total;
  var stars=pct>=.9?"⭐⭐⭐":pct>=.6?"⭐⭐":"⭐";
  var msg=pct>=.9?"You were great!":pct>=.6?"Good job!":"Let's do it again!";
  var status=el("div",{class:"note"});
  app.appendChild(el("div",{class:"card"},[
    el("h2",{text:S.name}),
    el("p",{class:"score",text:S.score+" / "+total}),
    el("div",{class:"stars",text:stars}),
    el("div",{class:"fb ok",text:msg}),
    status,
    el("button",{class:"main",type:"button",text:"Play again",onclick:function(){ORD=shuffle(Q.map(function(_,i){return i}));S.step=0;S.score=0;S.wrong=[];render()}})
  ]));
  var q=function(k,v){return "&"+k+"="+encodeURIComponent(v)};
  var url=FORM_URL+q(F.name,S.name)+q(F.cls,S.cls||"-")+q(F.lesson,LESSON)+q(F.score,S.score+"/"+total)+q(F.wrong,S.wrong.join(",")||"none");
  status.appendChild(el("a",{class:"main",target:"_blank",rel:"noopener",href:url,text:"Send to teacher"}));
  status.appendChild(el("p",{class:"ar",style:"margin-top:10px",text:"اضغط الزر، ثم اضغط Submit في الصفحة التي ستفتح."}));
}

render();
})();
</script>
</body></html>
